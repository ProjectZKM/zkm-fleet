hmac.workspace = true
sqlx.workspace = true
tokio.workspace = true
tonic.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
reqwest.workspace = true
prost.workspace = true

[dev-dependencies]
fleet-ziren-node = { path = "../fleet-ziren-node", default-features = false }
