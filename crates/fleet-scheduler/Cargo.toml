[package]
name = "fleet-scheduler"
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "fleet-scheduler"
path = "src/main.rs"

[dependencies]
fleet-proto.workspace = true
alloy-primitives.workspace = true
anyhow.workspace = true
async-trait.workspace = true
axum.workspace = true
clap.workspace = true
hex.workspace = true
parking_lot.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
sha2.workspace = true
hmac.workspace = true
libc = "0.2"
sqlx.workspace = true
tokio.workspace = true
tonic.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
rand = "0.8"
reqwest.workspace = true
base64 = "0.22"
fs2 = "0.4"
prost-native = { package = "prost", version = "0.14" }
tonic-native = { package = "tonic", version = "0.14", features = ["transport", "tls-ring"] }
tokio-stream = { version = "0.1", features = ["net"] }
trusted-shim = { git = "https://github.com/BotMesh/trusted-shim", rev = "e65689170e0bf6fc2a3252d9fd33de6cb73654ae", features = ["ziren", "openshell"] }

[dev-dependencies]
hyper-util = { version = "0.1", features = ["tokio"] }
tokio-util = { version = "0.7", features = ["rt"] }
bincode.workspace = true
prost.workspace = true
rcgen = "0.14"
fleet-proof-app = { path = "../fleet-proof-app" }
fleet-ziren-node = { path = "../fleet-ziren-node", default-features = false }
k256 = { version = "0.13", features = ["ecdsa"] }
tempfile.workspace = true
tower = { version = "0.5", features = ["util"] }
trusted-router-transport = { git = "https://github.com/BotMesh/trusted-data-router", rev = "8922da65ec7ab013e2f639234bbda95637f4860b" }
tokio-tungstenite = "0.29"
futures-util = "0.3"
