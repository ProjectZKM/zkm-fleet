[package]
name = "fleet-ziren-node"
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "fleet-ziren-node"
path = "src/main.rs"
required-features = ["prover-runtime"]

[features]
default = ["prover-runtime"]
prover-runtime = ["dep:zkm-sdk", "dep:zkm-prover", "dep:zkm-cuda", "dep:zkm-core-machine"]

[dependencies]
fleet-proto.workspace = true
anyhow.workspace = true
bincode.workspace = true
clap.workspace = true
lru.workspace = true
parking_lot.workspace = true
reqwest.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-stream = { version = "0.1", features = ["net"] }
tonic.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
sha2.workspace = true
prost.workspace = true

zkm-sdk = { workspace = true, optional = true }
zkm-prover = { workspace = true, optional = true }
zkm-cuda = { workspace = true, optional = true }
zkm-core-machine = { workspace = true, optional = true }

[dev-dependencies]
tempfile.workspace = true
hex.workspace = true
