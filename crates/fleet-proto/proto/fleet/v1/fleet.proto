syntax = "proto3";

package fleet.v1;

import "fleet/v1/types.proto";
import "fleet/model/v1/model.proto";

// Nodes initiate every connection. Heartbeats carry control metadata only;
// app-owned storage holds payloads. FetchInputs/PublishOutput remain for legacy jobs.

message ProveRequest {
  string job_id = 1;
  // Hex SHA-256 of the guest ELF, without 0x.
  string elf_id = 2;
  // Empty when the node reported this ELF as cached; the node answers
  // FAILED_PRECONDITION "elf_missing" if it was evicted meanwhile.
  bytes elf = 3;
  // ZKMStdin.buffer, one entry per guest read.
  repeated bytes stdin_buffer = 4;
  // ZKMStdin.proofs, each a bincode (ZKMReduceProof, StarkVerifyingKey) pair,
  // exactly as the SDK's network prover sends them.
  repeated bytes receipts = 5;
  ProofKind kind = 6;
}

message ProveResponse {
  // serde_json of zkm_sdk::ZKMProof: what the SDK's network prover parses.
  bytes proof_json = 1;
  // Raw public-values bytes (ZKMPublicValues::to_vec).
  bytes public_values = 2;
  uint64 cycles = 3;
  // Time the prover itself spent (the GPU server's own figure when it has one).
  uint64 prove_ms = 4;
  // Wall time of the whole call on the node, setup included.
  uint64 wall_ms = 5;
  string zkm_version = 6;
}

// Prover node -> scheduler. Cluster-internal port only.
service ControlService {
  rpc Register(RegisterRequest) returns (RegisterResponse);
  rpc Heartbeat(HeartbeatRequest) returns (HeartbeatResponse);
  rpc Deregister(DeregisterRequest) returns (DeregisterResponse);
  // Legacy payload path, refused for jobs with app-owned references.
  rpc FetchInputs(FetchInputsRequest) returns (ProveRequest);
  rpc PublishOutput(PublishOutputRequest) returns (PublishOutputResponse);
}

message PublishOutputRequest {
  string node_id = 1;
  Assignment assignment = 2;
  ProveResponse result = 3;
}

message PublishOutputResponse {}

message Assignment {
  string job_id = 1;
  // Stable across scheduler restarts, changes for each execution attempt.
  string lease = 2;
  string elf_id = 3;
  ProofInputs inputs = 4;
  ProofKind kind = 5;
}

message Completion {
  Assignment assignment = 1;
  reserved 2;
  // gRPC status code; zero means the node has finished handling its output.
  int32 error_code = 3;
  string error = 4;
  uint64 cycles = 5;
  uint64 prove_ms = 6;
  ProofOutputs outputs = 7;
}

message FetchInputsRequest {
  string node_id = 1;
  Assignment assignment = 2;
  bool include_elf = 3;
}

message NodeInfo {
  // Unique and stable across restarts of the same node (e.g. the Ray actor name).
  string name = 1;
  reserved 2; // Nodes have no inbound RPC endpoint.
  // "cuda", "cpu" or "mock".
  string backend = 3;
  uint32 gpus = 4;
  uint32 cpus = 5;
  // Proof-system version the node proves with (the SDK's circuit version).
  string zkm_version = 6;
  // GPU server image digest, for cuda nodes.
  string image = 7;
  string machine = 8;
  // Version 1 pulls work through heartbeat responses; push-only workers are refused.
  uint32 control_version = 9;
  // Dedicated proof app served by this prover node. All three are set together;
  // an app-specific node never accepts another app's proof jobs.
  string app_namespace = 10;
  string app_tenant = 11;
  string app_elf_id = 12;
}

message RegisterRequest {
  NodeInfo node = 1;
}

message RegisterResponse {
  string node_id = 1;
  uint32 heartbeat_secs = 2;
}

message HeartbeatRequest {
  string node_id = 1;
  bool ready = 2;
  repeated string cached_elf_ids = 3;
  // A proof is running; after a scheduler restart this is how it finds the job again.
  bool busy = 4;
  string running_job = 5;
  // Retried until the scheduler acknowledges this lease.
  Completion completion = 6;
}

message HeartbeatResponse {
  // False when the scheduler does not know this node id (it restarted): register again.
  bool known = 1;
  Assignment assignment = 2;
  string completed_lease = 3;
}

message DeregisterRequest {
  string node_id = 1;
}

message DeregisterResponse {}

// Machine agents use their own local Ray instance. No Ray cluster crosses machines.
service WorkerService {
  rpc Heartbeat(WorkerHeartbeatRequest) returns (WorkerHeartbeatResponse);
}

message NodeCommand {
  string id = 1;
  NodeOperation operation = 2;
  reserved 3;
  reserved "parameters_json";
  // Application execution parameters, not HTTP requests or user credentials.
  fleet.model.v1.Json parameters = 4;
}

message WorkerHeartbeatRequest {
  string worker_id = 1;
  // A fresh process session fences duplicate agents on one machine.
  string session = 2;
  reserved 3;
  reserved "report_json";
  // A storage-only fleet-ziren-node handler is configured on this machine.
  bool proof_fetch_ready = 4;
  // Capacity, inventories, job leases/status and command acknowledgements only.
  // Inputs, logs and outputs remain outside the heartbeat. Report version is 2.
  fleet.model.v1.NodeReport report = 5;
}

message WorkerHeartbeatResponse {
  uint32 heartbeat_secs = 1;
  repeated NodeCommand commands = 2;
  repeated string acknowledged_results = 3;
  // Terminal executions whose metadata and artifact receipts are durable.
  repeated string acknowledged_jobs = 4;
  repeated ProofFetch proof_fetches = 5;
}
