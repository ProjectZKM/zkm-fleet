[workspace]
members = ["crates/fleet-proto", "crates/fleet-scheduler", "crates/fleet-node", "crates/fleet-proof-app", "crates/fleet-ziren-node", "crates/fleetctl", "crates/fleet-mcp"]
default-members = ["crates/fleet-proto", "crates/fleet-scheduler", "crates/fleet-node", "crates/fleet-proof-app", "crates/fleetctl", "crates/fleet-mcp"]
resolver = "2"

[workspace.package]
version = "0.1.6"
edition = "2021"
publish = false

[workspace.dependencies]
fleet-proto = { path = "crates/fleet-proto" }

anyhow = "1"
http = "1"
async-trait = "0.1"
axum = "0.7"
bincode = "1.3"
clap = { version = "4.5", features = ["derive", "env"] }
hex = "0.4"
lru = "0.12"
parking_lot = "0.12"
prost = "0.13"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
hmac = "0.12"
sqlx = { version = "0.8", default-features = false, features = ["postgres", "runtime-tokio"] }
tempfile = "3"
tokio = { version = "1", features = ["full"] }
tonic = { version = "0.12", features = ["tls", "tls-webpki-roots"] }
tonic-build = "0.12"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
alloy-primitives = { version = "1", features = ["k256"] }

zkm-sdk = { git = "https://github.com/ProjectZKM/Ziren", rev = "e08a98236d033f940160ccfe244dec12df0dddb0" }
zkm-prover = { git = "https://github.com/ProjectZKM/Ziren", rev = "e08a98236d033f940160ccfe244dec12df0dddb0" }
zkm-cuda = { git = "https://github.com/ProjectZKM/Ziren", rev = "e08a98236d033f940160ccfe244dec12df0dddb0" }

[profile.release]
debug = 1
