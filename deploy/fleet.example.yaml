# fleet-scheduler configuration (inside the compose container: paths under /etc/zkm-fleet).
control_addr: 0.0.0.0:51001        # node-initiated gRPC; TLS uses the certificate below
http_addr: 0.0.0.0:9191            # /healthz, the API (each route needs a token permission), the nodes' relays
database_url_file: /etc/zkm-fleet/database_url
data_dir: /var/lib/zkm-fleet
heartbeat_secs: 5
node_stale_secs: 20
max_attempts: 2
# Nodes' shared secret. Every other caller has a token from the database: the first
# administrator's comes from `fleet-scheduler -c fleet.yaml issue-admin --label NAME --out FILE`.
cluster_token_file: /etc/zkm-fleet/cluster.token
control_tls:
  cert_path: /etc/zkm-fleet/tls/server.pem
  key_path: /etc/zkm-fleet/tls/server.key
