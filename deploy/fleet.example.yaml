# fleet-scheduler configuration (inside the compose container: paths under /etc/zkm-fleet).
stage_addr: 0.0.0.0:51000          # SDK proof API (server TLS; authorize with the user bearer token)
control_addr: 0.0.0.0:51001        # node-initiated gRPC; TLS uses the certificate below
http_addr: 0.0.0.0:9191            # public values for the SDK, /healthz, /admin (admin token)
public_url: https://fleet.example.com:8905
database_url_file: /etc/zkm-fleet/database_url
data_dir: /var/lib/zkm-fleet
proof_output_dir: /var/lib/zkm-fleet/proofs # control-host proof results received from nodes; no shared mount required
long_poll_ms: 2000
heartbeat_secs: 5
node_stale_secs: 20
max_attempts: 2
require_signature: true
cluster_token_file: /etc/zkm-fleet/cluster.token
admin_token_file: /etc/zkm-fleet/admin.token
tls:
  cert_path: /etc/zkm-fleet/tls/server.pem
  key_path: /etc/zkm-fleet/tls/server.key
control_tls:
  cert_path: /etc/zkm-fleet/tls/server.pem
  key_path: /etc/zkm-fleet/tls/server.key
tenants:
  - name: ethproofs
    class: latency
    anchor: exclusive
    backends: [cuda]
    max_queued: 16
  - name: goat
    class: batch
    anchor: shared
    max_queued: 64
