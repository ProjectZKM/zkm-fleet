# fleet-scheduler configuration (inside the compose container: paths under /etc/zkm-fleet).
stage_addr: 0.0.0.0:51000          # external, mutual TLS (the SDK only does TLS with a client cert)
control_addr: 0.0.0.0:51001        # cluster-internal: node registration (publish on the cluster interface only)
http_addr: 0.0.0.0:9191            # public values for the SDK, /healthz, /admin (admin token)
public_url: https://fleet.example.com:9191
database_url_file: /etc/zkm-fleet/database_url
data_dir: /var/lib/zkm-fleet
long_poll_ms: 2000
heartbeat_secs: 5
node_stale_secs: 20
job_timeout_secs: 3600
max_attempts: 2
require_signature: true
cluster_token_file: /etc/zkm-fleet/cluster.token
admin_token_file: /etc/zkm-fleet/admin.token
tls:
  cert_path: /etc/zkm-fleet/tls/server.pem
  key_path: /etc/zkm-fleet/tls/server.key
  client_ca_path: /etc/zkm-fleet/tls/ca.pem
tenants:
  - name: ethproofs
    class: latency
    anchor: exclusive
    backends: [cuda]
    max_queued: 16
  - name: goat
    class: batch
    anchor: shared
    max_queued: 64
# Proof sequences the scheduler drives from a cursor. The policy is here; the
# provider's commands are on the stream worker (services.yaml, kind: stream).
streams:
  - name: goat                    # independent blocks: several at once, skips ahead when far behind
    chained: false
    step: 2                       # every other block
    behind: 2                     # stay 2 blocks behind the head
    max_lag: 200                  # further behind than 200 steps: jump to the head
    parallel: 5                   # proofs in flight
    prefetch: 3                   # inputs fetched ahead of the proofs
    period_s: 6                   # head probe period
    attempts: 2                   # per step; a failed step is refetched and retried after retry_backoff_s * attempt
    retry_backoff_s: 20
    fetch_timeout_s: 300
    prove_timeout_s: 900
  - name: goat-state              # a chain: step n+1 verifies step n's proof, one in flight, never skipped
    chained: true
    step: 40
    behind: 0
    period_s: 30
    prove_timeout_s: 3600
