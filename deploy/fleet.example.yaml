# fleet-scheduler configuration (inside the compose container: paths under /etc/zkm-fleet).
stage_addr: 0.0.0.0:51000          # external, mutual TLS (the SDK only does TLS with a client cert)
control_addr: 0.0.0.0:51001        # cluster-internal: node registration (publish on the cluster interface only)
http_addr: 0.0.0.0:9191            # public values for the SDK, /healthz, /admin (admin token)
public_url: https://fleet.example.com:9191
database_url_file: /etc/zkm-fleet/database_url
data_dir: /var/lib/zkm-fleet
long_poll_ms: 2000
heartbeat_secs: 5
node_stale_secs: 20
job_timeout_secs: 3600
max_attempts: 2
require_signature: true
cluster_token_file: /etc/zkm-fleet/cluster.token
admin_token_file: /etc/zkm-fleet/admin.token
tls:
  cert_path: /etc/zkm-fleet/tls/server.pem
  key_path: /etc/zkm-fleet/tls/server.key
  client_ca_path: /etc/zkm-fleet/tls/ca.pem
tenants:
  - name: ethproofs
    class: latency
    anchor: exclusive
    backends: [cuda]
    max_queued: 16
  - name: goat
    class: batch
    anchor: shared
    max_queued: 64
