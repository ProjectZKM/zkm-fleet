# fleet-scheduler configuration.
stage_addr: 0.0.0.0:50000          # external, mutual TLS (the SDK only does TLS with a client cert)
control_addr: 10.0.0.1:50001       # cluster-internal: node registration
http_addr: 0.0.0.0:9091            # public values for the SDK, /healthz, /admin (admin token)
public_url: https://fleet.example.com:9091
database_url: postgres://fleet:CHANGE_ME@127.0.0.1:5432/fleet
data_dir: /var/lib/zkm-fleet
long_poll_ms: 2000
heartbeat_secs: 5
node_stale_secs: 20
job_timeout_secs: 3600
max_attempts: 2
require_signature: true
cluster_token_file: /etc/zkm-fleet/cluster.token   # fleetctl token new
admin_token_file: /etc/zkm-fleet/admin.token       # fleetctl token new
tls:                                               # fleetctl tls init
  cert_path: /etc/zkm-fleet/tls/server.pem
  key_path: /etc/zkm-fleet/tls/server.key
  client_ca_path: /etc/zkm-fleet/tls/ca.pem
tenants:
  - name: ethproofs
    class: latency
    anchor: exclusive
    zkm_version: v2.0.0
    backends: [cuda]
    max_queued: 16
  - name: goat
    class: batch
    anchor: shared
    max_queued: 64
