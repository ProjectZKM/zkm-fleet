# Fleet control plane, with the optional OpenShell gateway (profile openshell) and Trustee AS (profile trustee).
# Started by deploy/install.sh control.
# Site config and secrets live in ${FLEET_ETC:-/etc/zkm-fleet}.
services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: fleet
      POSTGRES_DB: fleet
      POSTGRES_PASSWORD_FILE: /run/secrets/pg_password
    secrets: [pg_password]
    networks: [fleet]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fleet -d fleet"]
      interval: 5s
      retries: 20

  scheduler:
    image: ${FLEET_SCHEDULER_IMAGE:?set FLEET_SCHEDULER_IMAGE in compose.env}
    # The component image's entrypoint is the bare binary, with no default
    # arguments; without this the scheduler looks for ./fleet.yaml and exits.
    command: ["-c", "/etc/zkm-fleet/fleet.yaml"]
    # Nor does it declare a health check; services that wait for a healthy
    # scheduler (openshell-gateway) need this one.
    healthcheck:
      test: ["CMD", "curl", "-sf", "--max-time", "2", "http://127.0.0.1:9191/healthz"]
      interval: 15s
      timeout: 3s
      retries: 3
      # A busy scheduler loads its records before it listens; match FLEET_CTL_HEALTH_WAIT.
      start_period: 300s
    restart: unless-stopped
    init: true   # PID 1 reaps the processes it inherits; the scheduler does not
    # The user that owns ${FLEET_ETC}: the secrets there are mode 600.
    user: "${FLEET_UID:-10001}:${FLEET_GID:-10001}"
    depends_on:
      postgres: { condition: service_healthy }
    networks:
      fleet: { ipv4_address: "${FLEET_SCHEDULER_IP:-172.28.250.10}" }
    environment:
      RUST_LOG: ${RUST_LOG:-info}
      FLEET_URL: http://127.0.0.1:9191
      FLEET_TOKEN_FILE: /etc/zkm-fleet/admin.token
    volumes:
      - ${FLEET_ETC:-/etc/zkm-fleet}:/etc/zkm-fleet:ro
      - ${FLEET_DATA:-fleet-data}:/var/lib/zkm-fleet    # a host path works too (owned by FLEET_UID)
      - type: volume
        source: openshell-run
        target: /run/zkm-fleet/openshell
        volume: { nocopy: true }
    ports:
      - "127.0.0.1:9191:9191" # local fleetctl; remote clients enter through HTTPS

  # Stock access-policy gateway. Fleet implements its remote compute driver; this container has no Docker
  # socket and cannot create workloads on the control host. It needs the scheduler's compute socket, which
  # exists only with policy_gateway.openshell, so it is off by default: `fleet-ctl.sh openshell up` checks
  # its files, prepares its volumes and adds the profile to COMPOSE_PROFILES.
  openshell-gateway:
    profiles: [openshell]
    image: ${FLEET_OPENSHELL_IMAGE:-ghcr.io/projectzkm/zkm-fleet-openshell:ce58cf8e9b953281352d98a637e41616295b1318}
    restart: unless-stopped
    init: true
    user: "${FLEET_UID:-10001}:${FLEET_GID:-10001}"
    depends_on:
      scheduler: { condition: service_healthy }
    networks: [fleet]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: ["/tmp:rw,nosuid,nodev,mode=1777"]
    environment:
      XDG_STATE_HOME: /var/lib/openshell/state
      XDG_CONFIG_HOME: /var/lib/openshell/config
    command:
      - --bind-address
      - 0.0.0.0
      - --port
      - "17670"
      - --health-port
      - "8081"
      - --config
      - /etc/openshell/gateway.toml
      - --db-url
      - sqlite:///var/lib/openshell/gateway.db?mode=rwc
      - --compute-driver
      - docker
      - --compute-driver-socket
      - /run/zkm-fleet/openshell/compute.sock
      - --tls-cert
      - /etc/openshell/server.pem
      - --tls-key
      - /etc/openshell/server.key
      - --tls-client-ca
      - /etc/openshell/ca.pem
      - --enable-mtls-auth
      - "true"
      - --enable-operator-auth
      - "true"
      - --enable-loopback-service-http
      - "false"
    volumes:
      - type: bind
        source: ${FLEET_ETC:-/etc/zkm-fleet}/openshell
        target: /etc/openshell
        read_only: true
        bind: { create_host_path: false }
      - type: volume
        source: openshell-run
        target: /run/zkm-fleet/openshell
        volume: { nocopy: true }
      - type: volume
        source: openshell-data
        target: /var/lib/openshell
        volume: { nocopy: true }
    ports:
      - "${FLEET_OPENSHELL_BIND:-127.0.0.1}:${FLEET_OPENSHELL_PORT:-17670}:17670"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--max-time", "2", "http://127.0.0.1:8081/readyz"]
      interval: 15s
      timeout: 3s
      start_period: 30s
      retries: 4
    stop_grace_period: 60s

  # Optional legacy/precheck adapter. DCAP ZK admission verifies original evidence
  # in the guest and does not depend on this service or its signed verdict.
  trustee-as:
    profiles: [trustee]
    image: ghcr.io/confidential-containers/staged-images/coco-as-grpc@sha256:f65a0a74972781d5a3a9595f6e1308b86343f940738a0b6a23c270a7e8bd065a
    restart: unless-stopped
    init: true
    networks: [fleet]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:rw,nosuid,nodev,mode=1777
      - /run/dcap:rw,nosuid,nodev,mode=700
    environment:
      QCNL_CONF_PATH: /run/dcap/qcnl.conf
    command: [grpc-as, --socket, '0.0.0.0:50004', --config-file, /etc/trustee/as.json]
    volumes:
      - trustee-data:/opt/confidential-containers/attestation-service
      - type: bind
        source: ./trustee/as.json
        target: /etc/trustee/as.json
        read_only: true
        bind: { create_host_path: false }
    stop_grace_period: 30s

  mcp:
    profiles: [mcp]
    image: ${FLEET_SCHEDULER_IMAGE:?set FLEET_SCHEDULER_IMAGE in compose.env}
    restart: unless-stopped
    user: "${FLEET_UID:-10001}:${FLEET_GID:-10001}"
    depends_on: [scheduler]
    networks: [fleet]
    entrypoint: [fleet-mcp]
    command: []
    healthcheck: { disable: true }
    environment:
      FLEET_MCP_BIND: 0.0.0.0:8906
      FLEET_URL: http://${FLEET_SCHEDULER_IP:-172.28.250.10}:9191
      FLEET_MCP_ALLOWED_HOSTS: ${FLEET_MCP_ALLOWED_HOSTS:-localhost:8906,127.0.0.1:8906}
      FLEETCTL_BIN: /usr/local/bin/fleetctl

  # Terminates HTTPS and holds client calls across scheduler restarts (deploy/gateway.yaml.in).
  gateway:
    image: envoyproxy/envoy:v1.35.3
    restart: unless-stopped
    user: "${FLEET_UID:-10001}:${FLEET_GID:-10001}"
    command: ["-c", "/etc/zkm-fleet/gateway.yaml", "--log-level", "warn"]
    networks: [fleet]
    volumes:
      - ${FLEET_ETC:-/etc/zkm-fleet}:/etc/zkm-fleet:ro
    ports:
      - "${GATEWAY_BIND:-0.0.0.0}:8905:8905"

# The scheduler's address is fixed so the gateway can reach it without DNS.
networks:
  fleet:
    ipam:
      config: [{ subnet: "${FLEET_SUBNET:-172.28.250.0/24}" }]

secrets:
  pg_password:
    file: ${FLEET_ETC:-/etc/zkm-fleet}/pg_password

volumes:
  pgdata: {}
  fleet-data: {}
  openshell-run: {}
  openshell-data: {}
  trustee-data: {}
