# Scheduler + Postgres + gateway. Started by deploy/install.sh control; config and secrets in ${FLEET_ETC:-/etc/zkm-fleet}.
services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: fleet
      POSTGRES_DB: fleet
      POSTGRES_PASSWORD_FILE: /run/secrets/pg_password
    secrets: [pg_password]
    networks: [fleet]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fleet -d fleet"]
      interval: 5s
      retries: 20

  scheduler:
    image: ${FLEET_SCHEDULER_IMAGE:?set FLEET_SCHEDULER_IMAGE in compose.env}
    restart: unless-stopped
    # The user that owns ${FLEET_ETC}: the secrets there are mode 600.
    user: "${FLEET_UID:-10001}:${FLEET_GID:-10001}"
    depends_on:
      postgres: { condition: service_healthy }
    networks:
      fleet: { ipv4_address: "${FLEET_SCHEDULER_IP:-172.28.250.10}" }
    environment:
      RUST_LOG: ${RUST_LOG:-info}
      FLEET_URL: http://127.0.0.1:9191
      FLEET_TOKEN_FILE: /etc/zkm-fleet/admin.token
    volumes:
      - ${FLEET_ETC:-/etc/zkm-fleet}:/etc/zkm-fleet:ro
      - ${FLEET_DATA:-fleet-data}:/var/lib/zkm-fleet    # a host path works too (owned by FLEET_UID)
    ports:
      - "127.0.0.1:9191:9191" # local fleetctl; remote clients enter through HTTPS

  mcp:
    profiles: [mcp]
    image: ${FLEET_SCHEDULER_IMAGE:?set FLEET_SCHEDULER_IMAGE in compose.env}
    restart: unless-stopped
    user: "${FLEET_UID:-10001}:${FLEET_GID:-10001}"
    depends_on: [scheduler]
    networks: [fleet]
    entrypoint: [fleet-mcp]
    command: []
    healthcheck: { disable: true }
    environment:
      FLEET_MCP_BIND: 0.0.0.0:8906
      FLEET_URL: http://${FLEET_SCHEDULER_IP:-172.28.250.10}:9191
      FLEET_MCP_ALLOWED_HOSTS: ${FLEET_MCP_ALLOWED_HOSTS:-localhost:8906,127.0.0.1:8906}
      FLEETCTL_BIN: /usr/local/bin/fleetctl

  # Terminates HTTPS and holds client calls across scheduler restarts (deploy/gateway.yaml.in).
  gateway:
    image: ${FLEET_GATEWAY_IMAGE:-envoyproxy/envoy:v1.35.3}
    restart: unless-stopped
    user: "${FLEET_UID:-10001}:${FLEET_GID:-10001}"
    command: ["-c", "/etc/zkm-fleet/gateway.yaml", "--log-level", "warn"]
    networks: [fleet]
    volumes:
      - ${FLEET_ETC:-/etc/zkm-fleet}:/etc/zkm-fleet:ro
    ports:
      - "${GATEWAY_BIND:-0.0.0.0}:8905:8905"

# The scheduler's address is fixed so the gateway can reach it without DNS.
networks:
  fleet:
    ipam:
      config: [{ subnet: "${FLEET_SUBNET:-172.28.250.0/24}" }]

secrets:
  pg_password:
    file: ${FLEET_ETC:-/etc/zkm-fleet}/pg_password

volumes:
  pgdata: {}
  fleet-data: {}
