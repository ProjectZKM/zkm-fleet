# Local apps advertised by fleet-node to the Rust scheduler.
scheduler: https://scheduler.example.com:8905
# With a private CA, install.sh node --scheduler-ca copies it here and sets this.
scheduler_ca_file: /etc/zkm-fleet/scheduler-ca.pem
cluster_token_file: /etc/zkm-fleet/cluster.token
# Legacy native provers (cpu-wrap below) run this binary. Release packages don't ship
# it: build it with `cargo build --locked --release -p fleet-ziren-node`.
node_binary: /opt/zkm-fleet/bin/fleet-ziren-node
log_dir: /var/log/zkm-fleet
gpu_port_range: [30100, 30199]     # GPU server, 127.0.0.1 only
# The persistent shim that runs packaged provers; install.sh node --with-shim sets these.
shim_binary: /opt/zkm-fleet/libexec/trusted-shim/SHA256/trusted-shim-runtime
shim_state_dir: /opt/zkm-fleet/work/shim
shim_daemon: true
# Nodes initiate authenticated control RPCs; no inbound prover ports.
apps:
  # Resources not reserved by enabled apps remain available to batch jobs.
  # A packaged SDK prover: the worker and its Ziren GPU server in one image built by
  # deploy/build-proof-image.sh, run by the shim. deploy/migrate-proof-runtime.py
  # writes these settings for an existing entry.
  - name: ethproofs-gpu
    kind: ziren-gpu
    namespace: ethproofs-user
    tag: scope=default
    app: ethproofs # the namespace's proof app this server proves for, alone
    elf_id: FULL_ELF_SHA256 # its program (fleetctl app add ethproofs --spec SPEC.json --elf-id FULL_ELF_SHA256)
    proof_storage_root: /srv/ethproofs # app endpoint and every eligible replica access this path
    replicas: 1
    gpus: 2
    cpus: 48                           # Ray reserves them for the GPU server and the worker together
    memory_gb: 256
    shm_gb: 64
    image: REGISTRY/PROOF@sha256:REPLACE
    runtime: {executor: shim, driver: docker}
    port_base: 0                       # the shim picks the loopback port
    container_port: 8080               # the worker's health endpoint
    health_path: /healthz
    volumes:                           # mounted at the same path inside
      - /srv/ethproofs
      - "{cluster_token_file}:ro"
      - "{scheduler_ca_file}:ro"
    env:
      FLEET_NODE_NAME: "{name}"
      FLEET_MACHINE: "{machine}"
      FLEET_SCHEDULER: "{scheduler}"
      FLEET_CLUSTER_TOKEN_FILE: "{cluster_token_file}"
      FLEET_SCHEDULER_CA_FILE: "{scheduler_ca_file}"
      FLEET_APP_NAMESPACE: "{namespace}"
      FLEET_APP: "{app}"
      FLEET_APP_ELF_ID: "{elf_id}"
      FLEET_APP_STORAGE_ROOT: "{proof_storage_root}"
      FLEET_GPUS: "{gpu_count}"
      FLEET_CPUS: "{cpu_count}"
      FLEET_IMAGE: "{image}"
      CUDA_VISIBLE_DEVICES: "{gpus}"
      ZKM_GPU_DEVICES: "{gpus}"
      RAYON_NUM_THREADS: "{cpu_count}"
      VERIFY_VK: "true"
      SHARD_SIZE: "16777216"
      ZIREN_LEAF_HOST_THREADS: "3"
      ZIREN_PROCESS_PER_GPU: "1"
      ZIREN_FUSE_LEAVES: "1"
      ZIREN_REDUCE_OVERLAP: "1"
      TMPDIR: /dev/shm
  # An agent that reserves no CPU: Ray reserves its memory_gb only, and its replicas
  # share the node's CPUs with a low weight (64, against Docker's 1024). cpu_limit and
  # memory_limit_gb are each container's hard limits, which cpus 0 requires. Its node's
  # shim needs the runtime-cpu-shares-v1 feature.
  - name: agent
    kind: app
    replicas: 4
    gpus: 0
    cpus: 0
    cpu_limit: 2                       # CPUs, fractions allowed
    memory_gb: 1
    memory_limit_gb: 2
    image: REGISTRY/AGENT@sha256:REPLACE
    runtime: {executor: shim, driver: docker}
    port_base: 51000
    command: [agent, --port, "{port}", --threads, "{cpu_count}"]   # {cpu_count} is 1 here
  # A legacy native CPU prover: it runs node_binary, so that binary must be installed.
  - name: cpu-wrap
    kind: ziren-cpu
    replicas: 1
    cpus: 16
    memory_gb: 64
  # A GPU app on its own port: ComfyUI from a tree on the host. Replica i serves on
  # port_base + i; volumes are mounted at the same path inside, so the tree's venv,
  # model links and database URLs work unchanged (`:ro`, `:rslave` for NFS).
  # Image: deploy/images/comfyui (Ubuntu 22.04 userland matching the venv).
  - name: comfyui
    kind: app
    namespace: system                  # existing namespace; creation is admin-only
    priority: 100                      # may displace lower-priority batch jobs in this namespace
    replicas: 2
    gpus: 1
    cpus: 8
    image: zkm-fleet-comfyui:22.04
    user: "1000:1000"
    port_base: 50000
    health_path: /system_stats
    workdir: /srv/comfyui
    volumes:
      - /srv/comfyui
      - /mnt/models:rslave
      - /opt/blender:ro
    env:
      PATH: /opt/blender:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    command: [/srv/comfyui/venv/bin/python, main.py, --port, "{port}", --cuda-device, "0",
              --disable-auto-launch, --database-url, "sqlite:///user/comfyui_w{index}.db"]
