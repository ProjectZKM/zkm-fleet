# Batch job profiles advertised by fleet-node (installed as ${FLEET_ETC}/jobs.yaml).
# The paths a job touches come with each request (`--mount PATH[:ro]`, repeated);
# a profile only bounds them: the roots a request may mount below, plus the
# image, the user and a GPU cap. A requested mount must already exist.
#
# Every batch job gets its own FLEET_JOBS_DIR/<id>/out, mounted read-write as $FLEET_OUT
# (`{out}` in the command). App owners retrieve outputs from their own storage;
# Fleet provides job status and logs with `fleetctl batch` and `fleetctl batch logs`.

profiles:
  trainer:
    namespace: system                  # existing admin-created namespace; use a user namespace for user jobs
    priority: 10                       # inherited by jobs; higher values run first
    image: zkm-fleet-comfyui:22.04      # the userland the tree's venv was built against
    user: "1000:1000"                   # owner of the mounted paths
    max_gpus: 2
    default_gpu_mem_gb: 8               # free VRAM a batch job needs on its card unless it passes --gpu-mem
    shm_gb: 16
    allow:                              # requests may mount these or paths below them
      - /srv/trainer
      - /srv/datasets
      - /srv/output
      - /mnt/models
      - /tmp/train_jobs
    env:
      HOME: /home/ubuntu
    # A higher-priority job/service in this namespace may preempt this batch job after
    # min_runtime_s: SIGTERM, SIGKILL stop_timeout_s later (also on cancel), then the
    # job queues again with the same id and out/, FLEET_ATTEMPT counting on, no --retry spent.
    preemptible: true
    min_runtime_s: 300
    stop_timeout_s: 30
