# Include inside the TLS server block that fronts the public HTTPS gateway.
# The MCP process binds to loopback; HTTPS terminates at this gateway.
location = /mcp {
    client_max_body_size 16m;
    proxy_pass http://127.0.0.1:8906/mcp;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_request_buffering off;
    proxy_buffering off;
}
