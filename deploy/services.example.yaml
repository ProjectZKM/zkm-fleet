# Prover actors: edit, then deploy/apply.sh (written by install.sh).
scheduler: http://10.0.0.1:51001
cluster_token_file: /etc/zkm-fleet/cluster.token
node_binary: /opt/zkm-fleet/bin/fleet-ziren-node
log_dir: /var/log/zkm-fleet
gpu_port_range: [30100, 30199]     # GPU server, 127.0.0.1 only
node_port_range: [31000, 31099]    # fleet-ziren-node, cluster network
services:
  # Ray hands out the lowest free cards in file order; a hold keeps a card free for
  # one-shot runs (deploy/run.sh) by taking it while the services after it start.
  - name: train-card
    kind: hold
    gpus: 1
  - name: ethproofs-gpu
    kind: ziren-gpu
    replicas: 1
    gpus: 2
    cpus: 48
    memory_gb: 256
    shm_gb: 64
    image: ghcr.io/projectzkm/ziren-gpu@sha256:REPLACE
    env:
      VERIFY_VK: "true"
      SHARD_SIZE: "16777216"
      ZIREN_LEAF_HOST_THREADS: "3"
      ZIREN_PROCESS_PER_GPU: "1"
      ZIREN_FUSE_LEAVES: "1"
      ZIREN_REDUCE_OVERLAP: "1"
      TMPDIR: /dev/shm
  - name: cpu-wrap
    kind: ziren-cpu
    replicas: 1
    cpus: 16
    memory_gb: 64
  # A stream worker: runs a stream's provider commands on its machine (no card) for
  # the scheduler's stream runner (fleet.yaml `streams:`). It leases `head`, `fetch`
  # and `prove` tasks and reports; `{seq}`, `{work}`, `{prev_seq}`, `{prev_artifact}`
  # and `{prev_job_id}` expand in the commands and env. The prove command proves
  # through the SDK against this scheduler (env_file = the tenant's credential).
  - name: goat-stream
    kind: stream
    stream: goat
    cpus: 4
    slots: 6                       # tasks at once on this worker; the stream's parallel/prefetch bound them
    provider:
      work: /var/lib/zkm-fleet/goat
      env_file: /etc/zkm-fleet/goat.env
      env:
        RPC_48816: https://rpc.example
        RUST_LOG: info
      head: [bash, -c, "curl -s -m 10 -H 'content-type: application/json' -d '{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"eth_blockNumber\",\"params\":[]}' $RPC_48816 | python3 -c 'import json,sys;print(int(json.load(sys.stdin)[\"result\"],16))'"]
      fetch: [/opt/goat/host, --block-number, "{seq}", --chain-id, "48816", --cache-dir, "{work}/cache"]
      prove: [/opt/goat/host, --block-number, "{seq}", --chain-id, "48816", --cache-dir, "{work}/cache", --prove]
      cleanup: [bash, -c, "rm -f {work}/cache/input/48816/{seq}.bin"]
      keep_logs: failed            # failed | all | none
  # A GPU app on its own port: ComfyUI from a tree on the host. Replica i serves on
  # port_base + i; volumes are mounted at the same path inside, so the tree's venv,
  # model links and database URLs work unchanged (`:ro`, `:rslave` for NFS).
  # Image: deploy/images/comfyui (Ubuntu 22.04 userland matching the venv).
  - name: comfyui
    kind: app
    replicas: 2
    gpus: 1
    cpus: 8
    image: zkm-fleet-comfyui:22.04
    user: "1000:1000"
    port_base: 50000
    health_path: /system_stats
    workdir: /srv/comfyui
    volumes:
      - /srv/comfyui
      - /mnt/models:rslave
      - /opt/blender:ro
    env:
      PATH: /opt/blender:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    command: [/srv/comfyui/venv/bin/python, main.py, --port, "{port}", --cuda-device, "0",
              --disable-auto-launch, --database-url, "sqlite:///user/comfyui_w{index}.db"]
