# Local execution services advertised by fleet-node to the Rust scheduler.
scheduler: https://scheduler.example.com:8905
# Copy the public CA certificate to every Ray worker at this path when using a
# private CA; the cluster token remains the node's bearer credential.
scheduler_ca_file: /etc/zkm-fleet/tls/ca.pem
cluster_token_file: /etc/zkm-fleet/cluster.token
node_binary: /opt/zkm-fleet/bin/fleet-ziren-node
log_dir: /var/log/zkm-fleet
gpu_port_range: [30100, 30199]     # GPU server, 127.0.0.1 only
# Nodes initiate authenticated control RPCs; no inbound prover ports.
proof_output_dir: /var/lib/zkm-fleet/proofs # legacy proof jobs only
services:
  # Resources not reserved by enabled apps remain available to batch jobs.
  - name: ethproofs-gpu
    kind: ziren-gpu
    namespace: ethproofs-user
    tag: scope=default
    app: ethproofs # the namespace's proof app this server proves for, alone
    elf_id: FULL_ELF_SHA256 # its program (fleetctl app add ethproofs --elf-id FULL_ELF_SHA256)
    proof_storage_root: /srv/ethproofs # app endpoint and every eligible replica access this path
    replicas: 1
    gpus: 2
    cpus: 48
    memory_gb: 256
    shm_gb: 64
    image: ghcr.io/projectzkm/ziren-gpu@sha256:REPLACE
    env:
      VERIFY_VK: "true"
      SHARD_SIZE: "16777216"
      ZIREN_LEAF_HOST_THREADS: "3"
      ZIREN_PROCESS_PER_GPU: "1"
      ZIREN_FUSE_LEAVES: "1"
      ZIREN_REDUCE_OVERLAP: "1"
      TMPDIR: /dev/shm
  - name: cpu-wrap
    kind: ziren-cpu
    replicas: 1
    cpus: 16
    memory_gb: 64
  # A GPU app on its own port: ComfyUI from a tree on the host. Replica i serves on
  # port_base + i; volumes are mounted at the same path inside, so the tree's venv,
  # model links and database URLs work unchanged (`:ro`, `:rslave` for NFS).
  # Image: deploy/images/comfyui (Ubuntu 22.04 userland matching the venv).
  - name: comfyui
    kind: app
    namespace: system                  # existing namespace; creation is admin-only
    priority: 100                      # may displace lower-priority batch jobs in this namespace
    replicas: 2
    gpus: 1
    cpus: 8
    image: zkm-fleet-comfyui:22.04
    user: "1000:1000"
    port_base: 50000
    health_path: /system_stats
    workdir: /srv/comfyui
    volumes:
      - /srv/comfyui
      - /mnt/models:rslave
      - /opt/blender:ro
    env:
      PATH: /opt/blender:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    command: [/srv/comfyui/venv/bin/python, main.py, --port, "{port}", --cuda-device, "0",
              --disable-auto-launch, --database-url, "sqlite:///user/comfyui_w{index}.db"]
