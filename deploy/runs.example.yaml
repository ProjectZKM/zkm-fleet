# One-shot job profiles for deploy/run.sh (installed as ${FLEET_ETC}/runs.yaml).
# The paths a job touches come with each request (`--mount PATH[:ro]`, repeated);
# a profile only bounds them: the roots a request may mount below, plus the
# image, the user and a GPU cap. A requested mount must already exist.
profiles:
  trainer:
    image: zkm-fleet-comfyui:22.04      # the userland the tree's venv was built against
    user: "1000:1000"                   # owner of the mounted paths
    max_gpus: 2
    shm_gb: 16
    allow:                              # requests may mount these or paths below them
      - /srv/trainer
      - /srv/datasets
      - /srv/output
      - /mnt/models
      - /tmp/train_jobs
    env:
      HOME: /home/ubuntu
