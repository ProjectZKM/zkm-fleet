[project]
name = "fleet-bridge"
version = "0.1.0"
description = "Local Ray execution adapter for Fleet apps and batches"
requires-python = ">=3.10"
dependencies = ["ray==2.59.0", "pyyaml>=6"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["fleet_bridge"]

[tool.mypy]
python_version = "3.10"
strict = true
disallow_untyped_decorators = false   # ray.remote is untyped
ignore_missing_imports = true
warn_unreachable = true
