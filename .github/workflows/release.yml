name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, for example v0.2.0'
        required: true
        type: string

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  openshell-image:
    uses: ./.github/workflows/openshell-image.yml
    with:
      ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

  build-release:
    name: Build release components
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Resolve release tag
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            TAG='${{ inputs.tag }}'
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          # SemVer only: the workspace version must equal the tag, and Cargo has no v1.2.3.4.
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: $TAG" >&2
            exit 1
          fi
          echo "RELEASE_TAG=$TAG" >> "$GITHUB_ENV"
          echo "RELEASE_VERSION=${TAG#v}" >> "$GITHUB_ENV"
          echo "FLEET_VERSION=${TAG#v}" >> "$GITHUB_ENV"

      # The binaries report CARGO_PKG_VERSION (MCP serverInfo, OpenShell extension metadata).
      - name: Require the workspace version to match the tag
        shell: bash
        run: |
          set -euo pipefail
          WORKSPACE_VERSION=$(awk '
            /^\[/ { section = $0; next }
            section == "[workspace.package]" && /^version[[:space:]]*=/ { gsub(/^[^"]*"|".*$/, ""); print; exit }
          ' Cargo.toml)
          if [ "$WORKSPACE_VERSION" != "$RELEASE_VERSION" ]; then
            echo "Cargo.toml's workspace version is '$WORKSPACE_VERSION', but the tag $RELEASE_TAG needs $RELEASE_VERSION" >&2
            exit 1
          fi

      # Fail before publishing an image for a tag that has no Release to attach assets to.
      - name: Require an existing GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release view "$RELEASE_TAG" >/dev/null

      - name: Install protobuf compiler
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Install repository Rust toolchain
        run: rustup show active-toolchain

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-release-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-release-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-

      - name: Build release components
        run: |
          cargo build --locked --release \
            -p fleet-scheduler -p fleetctl -p fleet-mcp -p fleet-node -p fleet-proof-app

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: false

      # Both come from one checkout of the shim revision Fleet pins. `cargo
      # install --git` cannot be used: it scans the whole repository and stops
      # at shim's nested workspaces. The helper is built by the pinned shim's
      # own script from the Router revision shim locks, so it always matches
      # the shim binary bundled beside it.
      - name: Build the pinned node runtime companion and Chisel tunnel helper
        shell: bash
        run: |
          set -euo pipefail
          TRUSTED_SHIM_REV=$(sed -n 's/^trusted-shim = .*rev = "\([0-9a-f]\{40\}\)".*/\1/p' crates/fleet-scheduler/Cargo.toml)
          [ -n "$TRUSTED_SHIM_REV" ] || { echo "crates/fleet-scheduler/Cargo.toml pins no trusted-shim rev" >&2; exit 1; }
          SRC=$(mktemp -d)
          git -C "$SRC" init -q
          git -C "$SRC" fetch -q --depth 1 https://github.com/attestx/trusted-shim "$TRUSTED_SHIM_REV"
          git -C "$SRC" checkout -q --detach FETCH_HEAD
          cargo install --locked --force --path "$SRC" \
            --features ziren --bin trusted-shim-runtime --root target/shim
          locked() { awk -v n="name = \"$1\"" '$0 == n { f = 1; next } f && /^source = / { sub(/.*#/, ""); sub(/"$/, ""); print; exit }' "$2"; }
          SHIM_ROUTER=$(locked trusted-router-transport "$SRC/Cargo.lock")
          FLEET_ROUTER=$(locked trusted-router-transport Cargo.lock)
          [ -n "$SHIM_ROUTER" ] && [ "$SHIM_ROUTER" = "$FLEET_ROUTER" ] \
            || { echo "Fleet locks router $FLEET_ROUTER but shim $TRUSTED_SHIM_REV locks $SHIM_ROUTER" >&2; exit 1; }
          "$SRC/scripts/build_tunnel_helper.sh" "$PWD/target/shim/bin/trusted-router-tunnel"
          echo "TRUSTED_SHIM_REV=$TRUSTED_SHIM_REV" >> "$GITHUB_ENV"
          echo "TRUSTED_ROUTER_REV=$SHIM_ROUTER" >> "$GITHUB_ENV"
          rm -rf "$SRC"

      - name: Publish component images to GHCR
        env:
          REGISTRY_TOKEN: ${{ github.token }}
          PUBLISH: 'true'
        run: |
          echo "$REGISTRY_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          bash deploy/build-component-images.sh target/release "ghcr.io/${GITHUB_REPOSITORY,,}" "$RELEASE_VERSION"

      - name: Build release package
        shell: bash
        run: |
          set -euo pipefail
          DIST="dist/zkm-fleet-${RELEASE_VERSION}-linux-x86_64"
          mkdir -p "$DIST/bin" "$DIST/deploy" "$DIST/bridge" "$DIST/docs" "dist"
          install -m 755 target/release/fleet-scheduler "$DIST/bin/"
          install -m 755 target/release/fleetctl "$DIST/bin/"
          install -m 755 target/release/fleet-mcp "$DIST/bin/"
          install -m 755 target/release/fleet-node "$DIST/bin/"
          install -m 755 target/release/fleet-proof-app "$DIST/bin/"
          install -m 755 target/shim/bin/trusted-shim-runtime "$DIST/bin/"
          install -m 755 target/shim/bin/trusted-router-tunnel "$DIST/bin/"
          cp -a deploy/docker-compose.yml deploy/gateway.yaml.in \
            deploy/install.sh deploy/setup.sh deploy/fleet-watchdog.sh deploy/ray-start.sh deploy/node-start.sh deploy/fleet-ctl.sh \
            deploy/shim-start.sh deploy/ray-watch.sh deploy/install-node-services.sh \
            deploy/migrate-proof-runtime.py "$DIST/deploy/"
          cp -a deploy/trustee "$DIST/deploy/"
          cp -a bridge/pyproject.toml bridge/fleet_bridge "$DIST/bridge/"
          # README.md links docs/*.md, so they keep their place beside it.
          cp README.md "$DIST/"
          cp docs/*.md "$DIST/docs/"
          printf 'version=%s\n' "$RELEASE_VERSION" > "$DIST/VERSION"
          printf 'trusted_shim_revision=%s\n' "$TRUSTED_SHIM_REV" >> "$DIST/VERSION"
          printf 'trusted_router_tunnel_revision=%s\n' "$TRUSTED_ROUTER_REV" >> "$DIST/VERSION"
          tar -C dist -czf "dist/zkm-fleet-${RELEASE_VERSION}-linux-x86_64.tar.gz" "zkm-fleet-${RELEASE_VERSION}-linux-x86_64"
          cd dist
          sha256sum "zkm-fleet-${RELEASE_VERSION}-linux-x86_64.tar.gz" > "zkm-fleet-${RELEASE_VERSION}-linux-x86_64.tar.gz.sha256"

      - name: Upload assets to existing GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release upload "$RELEASE_TAG" \
            "dist/zkm-fleet-${RELEASE_VERSION}-linux-x86_64.tar.gz" \
            "dist/zkm-fleet-${RELEASE_VERSION}-linux-x86_64.tar.gz.sha256" \
            --clobber
