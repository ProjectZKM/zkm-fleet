name: Ziren proof worker image
on:
  workflow_dispatch:
    inputs:
      gpu_image:
        description: Validated Ziren 2.0 GPU image, including @sha256 digest
        required: true
        type: string
permissions:
  contents: read
  packages: write
jobs:
  image:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler libclang-dev
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
      - name: Build complete worker without running a prover
        env:
          GPU_IMAGE: ${{ inputs.gpu_image }}
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}-ziren-node:sha-$(git rev-parse HEAD)"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
          bash deploy/build-proof-image.sh "$IMAGE" "$GPU_IMAGE"
      - name: Publish to GHCR
        env:
          REGISTRY_TOKEN: ${{ github.token }}
        run: |
          echo "$REGISTRY_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push "$IMAGE"
