<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1430" viewBox="0 0 1800 1430" role="img" aria-labelledby="title desc">
<title id="title">zkm-fleet architecture: independent Ray on each execution machine</title>
<desc id="desc">Rust chooses the execution machine and enforces shared namespace quotas. Each machine runs fleet-node and its own independent local Ray head. The small execution adapter asks local Ray for CPU/GPU placement groups and actors for proofs, finite batches and serving. Other machines run separate Ray instances; neither the control plane nor clients connect to Ray. Machines initiate unary heartbeats. App-owned storage retains inputs and outputs; authorized fetches use heartbeat tickets and machine-initiated HTTPS uploads. There are no runtime SSH channels or inbound node APIs.</desc>
