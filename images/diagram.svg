<text x="82" y="840" class="detail">Shared CPU / GPU pool · Ray placement groups</text>

<rect x="820" y="525" width="740" height="350" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="842" y="560" class="name">Execution machine B … N</text>
<rect x="842" y="580" width="696" height="75" rx="10" class="box"/>
<text x="862" y="612" class="name">Fleet node agent + local Ray</text>
<text x="862" y="639" class="small">Independent runtime · the same execution and reporting contract</text>
<path d="M1000 655V685 M1370 655V685" class="data"/>
<rect x="842" y="685" width="328" height="105" rx="10" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
<text x="862" y="718" class="name">Apps</text>
<text x="862" y="748" class="detail">Long-running replicas / workers</text>
<text x="862" y="774" class="small">Reserve resources while enabled</text>
<rect x="1210" y="685" width="328" height="105" rx="10" fill="#faf5ff" stroke="#d8b4fe" stroke-width="1.5"/>
<text x="1230" y="718" class="name">Batch jobs</text>
<text x="1230" y="748" class="detail">Finite commands · queued runs</text>
<text x="1230" y="774" class="small">Release after completion + cleanup</text>
<rect x="842" y="810" width="696" height="45" rx="10" class="box"/>
<text x="862" y="840" class="detail">Shared CPU / GPU pool · Ray placement groups</text>

<!-- The data layer belongs to applications, rather than scheduler metadata. -->
<path d="M410 875V920 M1190 875V920" class="local"/>
<path d="M410 875L402 887H418Z M1190 875L1182 887H1198Z" fill="#15803d"/>
<rect x="40" y="920" width="1520" height="80" rx="12" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
<text x="62" y="954" class="name">Application-owned storage + artifacts</text>
<text x="62" y="983" class="detail">Inputs · checkpoints · proofs · outputs · optional shared mounts</text>
<text x="1080" y="966" class="small">Workers read / write directly</text>
<text x="40" y="1030" class="small">Apps expose application-specific endpoints or run their own pipelines. SDK proof requests may use the Fleet gateway.</text>
<text x="40" y="1058" class="small">Dashed gray: node control + metadata. Green: worker data access. Each batch runs on one machine; machines use separate Ray runtimes.</text>
</svg>
