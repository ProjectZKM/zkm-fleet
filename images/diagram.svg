<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1080" viewBox="0 0 1600 1080" role="img" aria-labelledby="title desc">
<title id="title">Fleet architecture: apps and batch jobs sharing CPU and GPU resources</title>
<desc id="desc">Operators, SDK clients and automation use Fleet's authenticated gateway. The control host contains the scheduler and durable workload state. The scheduler applies namespace quotas, priority, admission, placement and recovery for both long-running apps and finite batch jobs. Each execution machine runs its own Fleet node agent and independent local Ray runtime. Node-initiated heartbeats report capacity and state; responses carry commands. Apps and batch workers share reserved CPU and GPU resources. Workers read and write application-owned storage directly. Application protocols remain application-specific; SDK proof requests can use the gateway. More machines follow the same pattern.</desc>
<defs>
<marker id="control" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker>
<marker id="data" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#2563eb"/></marker>
<marker id="local" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#15803d"/></marker>
</defs>
<style>
text{font-family:Arial,Helvetica,sans-serif;fill:#0f172a}
.title{font-size:30px;font-weight:700}.name{font-size:22px;font-weight:700}
.detail{font-size:18px;fill:#475569}.small{font-size:16px;fill:#475569}
.box{fill:#fff;stroke:#cbd5e1;stroke-width:1.5}
.control{fill:none;stroke:#64748b;stroke-width:2.5;stroke-dasharray:8 6;marker-end:url(#control)}
.data{fill:none;stroke:#2563eb;stroke-width:2.5;marker-end:url(#data)}
.local{fill:none;stroke:#15803d;stroke-width:2.5;marker-end:url(#local)}
</style>
