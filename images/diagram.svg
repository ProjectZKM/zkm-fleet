<rect x="65" y="732" width="370" height="86" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
<text x="83" y="761" class="name" text-anchor="start">Python bridge · apply</text>
<text x="83" y="785" class="detail" text-anchor="start">services.yaml → detached Ray actors</text>
<rect x="520" y="244" width="768" height="596" rx="12" fill="#f0fdf4" stroke="#bbf7d0"/>
<text x="543" y="274" class="section" text-anchor="start">Ray cluster · one Ray node per machine</text>
<rect x="555" y="300" width="698" height="70" rx="12" fill="#dcfce7" stroke="#cbd5e1"/>
<text x="573" y="329" class="name" text-anchor="start">Ray allocation &amp; execution</text>
<text x="573" y="353" class="detail" text-anchor="start">Placement groups reserve resources; Ray restarts actors</text>
<rect x="555" y="443" width="300" height="95" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
<text x="573" y="472" class="name" text-anchor="start">Proof node actor</text>
