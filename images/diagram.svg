<text x="900" y="415" class="detail">Outbound unary heartbeats · capacity, state and command acknowledgements</text>
<text x="900" y="439" class="detail">Small Python adapter executes typed commands against this machine's Ray</text>
<text x="900" y="463" class="detail">Artifact fetches run separately from heartbeats and GPU actors</text>
<rect class="box" x="880" y="545" width="830" height="105" rx="14" fill="#dcfce7" stroke="#16a34a"/>
<text x="900" y="577" class="panel">Local Ray · independent head on this machine</text>
<text x="900" y="607" class="detail">Placement groups reserve this machine's CPU / GPU units; actors launch local containers</text>
<text x="900" y="631" class="detail">Other machines have separate Ray instances. No shared Ray cluster or remote Ray route.</text>
<!-- App endpoint is a machine service, not a Ray actor -->
