<text x="86" y="1418" class="s">Heartbeats and commands</text>
<path d="M282.015625 1413H316.015625" class="blue"/>
<text x="328.015625" y="1418" class="s">Requests and launches</text>
<path d="M502.28125 1413H536.28125" class="orange"/>
<text x="548.28125" y="1418" class="s">App service traffic</text>
<path d="M687.265625 1413H721.265625" class="green"/>
<text x="733.265625" y="1418" class="s">Worker data access</text>
<rect x="884.6875" y="1403" width="34" height="20" rx="5" class="opt"/>
<text x="930.6875" y="1418" class="s">Optional</text>
<circle cx="1023.8125" cy="1413" r="13" class="badge-c"/>
<text x="1023.8125" y="1418" class="badge" text-anchor="middle">1</text>
<text x="1044.8125" y="1418" class="s">Step in the README</text>
<text x="40" y="1448" class="s">Each batch job runs on one machine · machines use separate Ray runtimes · SDK proof requests may use the Fleet gateway</text>
</svg>
