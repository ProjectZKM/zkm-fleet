<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">zkm-fleet architecture</title>
  <desc id="desc">Proof and MCP clients enter through HTTPS. Node control uses node-initiated TLS gRPC heartbeats. An optional SSH tunnel is for operator access to private APIs only. App ports are direct private endpoints and do not receive Fleet token or namespace checks; external app access needs an authenticated proxy.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#475569"/></marker>
    <marker id="arrowStart" markerWidth="10" markerHeight="10" refX="2" refY="5" orient="auto"><path d="M10 0L0 5L10 10Z" fill="#15803d"/></marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#15803d"/></marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2563eb"/></marker>
    <marker id="arrowOrange" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#c2410c"/></marker>
  </defs>
  <style>
    text{font-family:Inter,Arial,Helvetica,sans-serif;fill:#0f172a}
    .title{font-size:30px;font-weight:750}
    .subtitle{font-size:16px;fill:#475569}
    .panel-title{font-size:21px;font-weight:700}
    .name{font-size:18px;font-weight:700}
    .detail{font-size:14px;fill:#475569}
    .small{font-size:12px;fill:#475569}
    .client{fill:#f8fafc;stroke:#cbd5e1;stroke-width:1.5}
    .control{fill:#eff6ff;stroke:#93c5fd;stroke-width:1.5}
    .compute{fill:#f0fdf4;stroke:#86efac;stroke-width:1.5}
    .component{fill:#fff;stroke:#cbd5e1;stroke-width:1.5}
    .gateway{fill:#eff6ff;stroke:#60a5fa;stroke-width:1.5}
    .mcp{fill:#f5f3ff;stroke:#a78bfa;stroke-width:1.5}
    .work{fill:#fff;stroke:#86efac;stroke-width:1.4}
    .storage{fill:#fffbeb;stroke:#fbbf24;stroke-width:1.4}
    .line{fill:none;stroke:#475569;stroke-width:2.2;marker-end:url(#arrow)}
    .https{fill:none;stroke:#2563eb;stroke-width:2.4;marker-end:url(#arrowBlue)}
    .heartbeat{fill:none;stroke:#15803d;stroke-width:2.5;marker-start:url(#arrowStart);marker-end:url(#arrowGreen)}
    .config{fill:none;stroke:#c2410c;stroke-width:2.3;stroke-dasharray:8 6;marker-end:url(#arrowOrange)}
    .private{fill:none;stroke:#64748b;stroke-width:2;stroke-dasharray:5 5;marker-end:url(#arrow)}
    .label-bg{fill:#fff;stroke:#e2e8f0;stroke-width:1}
    .legend{font-size:13px;fill:#334155}
  </style>

  <rect width="1600" height="1000" fill="#fff"/>
  <text x="40" y="48" class="title">zkm-fleet · shared GPU / CPU fleet</text>
  <text x="40" y="76" class="subtitle">Namespaces own and account for work; Ray places it; nodes report progress through outbound heartbeats.</text>

  <!-- Clients -->
  <g>
    <rect x="40" y="105" width="360" height="108" rx="14" class="client"/>
    <text x="62" y="137" class="name">Proof SDK clients</text>
    <text x="62" y="164" class="detail">EthProofs · GOAT</text>
    <text x="62" y="188" class="detail">Ziren network prover · bearer token</text>

    <rect x="430" y="105" width="360" height="108" rx="14" class="client"/>
    <text x="452" y="137" class="name">fleetctl</text>
    <text x="452" y="164" class="detail">Operator and namespace workflows</text>
    <text x="452" y="188" class="detail">Operator-only tunnel to private APIs</text>

    <rect x="820" y="105" width="360" height="108" rx="14" class="client"/>
    <text x="842" y="137" class="name">MCP clients</text>
    <text x="842" y="164" class="detail">Streamable HTTP · HTTPS <tspan font-family="monospace">/mcp</tspan></text>
    <text x="842" y="188" class="detail">Anonymous discovery · bearer token for tools</text>

    <rect x="1210" y="105" width="350" height="108" rx="14" class="client"/>
    <text x="1232" y="137" class="name">App clients</text>
    <text x="1232" y="164" class="detail">ComfyUI · inference endpoints</text>
    <text x="1232" y="188" class="detail">Private callers only · app-owned auth</text>
  </g>

  <!-- Control plane -->
  <rect x="40" y="265" width="470" height="690" rx="18" class="control"/>
  <text x="66" y="302" class="panel-title">Control plane</text>

  <rect x="68" y="326" width="414" height="106" rx="12" class="gateway"/>
  <text x="88" y="357" class="name">HTTPS gateway</text>
  <text x="88" y="383" class="detail">Proof SDK · gRPC :51000 · server-auth TLS</text>
  <text x="88" y="407" class="detail">HTTPS <tspan font-family="monospace">/mcp</tspan> · proxy to loopback MCP adapter</text>

  <rect x="68" y="474" width="414" height="126" rx="12" class="component"/>
  <text x="88" y="506" class="name">Rust scheduler</text>
  <text x="88" y="532" class="detail">Proof admission · placement · job state</text>
  <text x="88" y="556" class="detail">Namespace / tag access, quotas, app priority</text>
  <text x="88" y="580" class="detail">Private admin API · TLS node control :51001</text>

  <rect x="68" y="642" width="194" height="118" rx="12" class="mcp"/>
  <text x="86" y="674" class="name">MCP adapter</text>
  <text x="86" y="700" class="small">Separate Rust adapter process</text>
  <text x="86" y="724" class="small">Loopback :8906 · gateway only</text>
  <text x="86" y="746" class="small">Bearer checked at tool call</text>

  <rect x="280" y="642" width="202" height="118" rx="12" class="component"/>
  <text x="298" y="674" class="name">Postgres</text>
  <text x="298" y="700" class="detail">Apps · jobs · tokens</text>
  <text x="298" y="724" class="detail">Namespaces · reservations</text>

  <rect x="68" y="805" width="414" height="106" rx="12" class="component"/>
  <text x="88" y="837" class="name">Python bridge · apply</text>
  <text x="88" y="864" class="detail"><tspan font-family="monospace">services.yaml</tspan> → detached Ray actors</text>
  <text x="88" y="888" class="detail">Drains / replaces services; launches run API</text>

  <!-- Ray compute plane -->
  <rect x="600" y="265" width="960" height="690" rx="18" class="compute"/>
  <text x="626" y="302" class="panel-title">Ray compute plane · one Ray node per machine</text>

  <rect x="630" y="326" width="900" height="76" rx="12" fill="#dcfce7" stroke="#86efac" stroke-width="1.5"/>
  <text x="654" y="357" class="name">Ray resource allocation and actor execution</text>
  <text x="654" y="382" class="detail">Placement groups reserve CPU / GPU units · detached actors recover on failure</text>

  <!-- Workload lanes -->
  <rect x="630" y="438" width="270" height="320" rx="14" fill="#f7fee7" stroke="#bef264" stroke-width="1.4"/>
  <text x="650" y="470" class="name">Proofs</text>
  <rect x="650" y="487" width="230" height="104" rx="10" class="work"/>
  <text x="668" y="518" class="name">Proof node actor</text>
  <text x="668" y="544" class="detail">fleet-ziren-node</text>
  <text x="668" y="568" class="detail">Assignment / result metadata</text>
  <rect x="650" y="620" width="230" height="102" rx="10" class="work"/>
  <text x="668" y="652" class="name">Local Ziren GPU server</text>
  <text x="668" y="678" class="detail">Dedicated to one proof app</text>
  <text x="668" y="702" class="detail">Loopback on the same node</text>

  <rect x="930" y="438" width="270" height="320" rx="14" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.4"/>
  <text x="950" y="470" class="name">One-shot runs</text>
  <rect x="950" y="487" width="230" height="104" rx="10" class="work"/>
  <text x="968" y="518" class="name">Runs API actor</text>
  <text x="968" y="544" class="detail">Private :9192 · user token</text>
  <text x="968" y="568" class="detail">Profiles · admission · lifecycle</text>
  <rect x="950" y="620" width="230" height="102" rx="10" class="work"/>
  <text x="968" y="652" class="name">Run container</text>
  <text x="968" y="678" class="detail">PI / batch workload</text>
  <text x="968" y="702" class="detail">Ray-granted CPU / GPU units</text>

  <rect x="1230" y="438" width="270" height="320" rx="14" fill="#fff7ed" stroke="#fdba74" stroke-width="1.4"/>
  <text x="1250" y="470" class="name">Persistent apps</text>
  <rect x="1250" y="520" width="230" height="150" rx="10" class="work"/>
  <text x="1268" y="554" class="name">App actor / container</text>
  <text x="1268" y="584" class="detail">ComfyUI · inference</text>
  <text x="1268" y="610" class="detail">Replica reserves its resources</text>
  <text x="1268" y="640" class="detail">Fleet does not proxy or authorize</text>

  <!-- Job-level storage -->
  <rect x="630" y="800" width="425" height="112" rx="12" class="storage"/>
  <text x="652" y="832" class="name">Proof job artifacts</text>
  <text x="652" y="858" class="detail">Node writes proof / public values durably</text>
  <text x="652" y="884" class="detail">SDK adapter reads; scheduler tracks metadata</text>

  <rect x="1075" y="800" width="425" height="112" rx="12" class="storage"/>
  <text x="1097" y="832" class="name">Run storage · <tspan font-family="monospace">RUNS_DIR</tspan></text>
  <text x="1097" y="858" class="detail">Job inputs · logs · outputs · checkpoints</text>
  <text x="1097" y="884" class="detail">Shared mount when workers need common files</text>

  <!-- Client and service flows -->
  <path d="M220 213V326" class="https"/>
  <rect x="230" y="239" width="152" height="24" rx="5" class="label-bg"/>
  <text x="239" y="256" class="small">server TLS + bearer</text>

  <path d="M1000 213V238H520V380H482" class="https"/>
  <rect x="658" y="222" width="174" height="24" rx="5" class="label-bg"/>
  <text x="669" y="239" class="small">HTTPS <tspan font-family="monospace">/mcp</tspan> → loopback MCP</text>

  <path d="M68 380H52V696H68" class="line"/>

  <path d="M1385 213V238H1540V595H1480" class="line"/>
  <rect x="1440" y="444" width="104" height="23" rx="5" class="label-bg"/>
  <text x="1449" y="460" class="small">private port</text>

  <path d="M610 213V238H545V535H482" class="private"/>
  <rect x="516" y="433" width="112" height="24" rx="5" class="label-bg"/>
  <text x="525" y="450" class="small">optional SSH</text>

  <path d="M482 535H630" class="heartbeat"/>
  <rect x="489" y="507" width="136" height="24" rx="5" class="label-bg"/>
  <text x="497" y="524" class="small">gRPC :51001</text>

  <path d="M765 402V487" class="line"/>
  <path d="M1065 402V487" class="line"/>
  <path d="M1365 402V520" class="line"/>
  <path d="M765 591V620" class="line"/>
  <path d="M1065 591V620" class="line"/>
  <path d="M765 758V800" class="line"/>
  <path d="M1065 758V800" class="line"/>
  <path d="M450 432V474" class="line"/>
  <rect x="359" y="438" width="82" height="22" rx="5" class="label-bg"/>
  <text x="367" y="454" class="small">stage API</text>
  <path d="M382 600V642" class="line"/>

  <path d="M482 858H560V414H630" class="config"/>
  <rect x="490" y="875" width="132" height="24" rx="5" class="label-bg"/>
  <text x="500" y="892" class="small">desired state</text>

  <!-- Legend -->
  <path d="M42 976H94" class="https"/>
  <text x="106" y="981" class="legend">Client / HTTPS flow</text>
  <path d="M310 976H362" class="heartbeat"/>
  <text x="374" y="981" class="legend">Node-initiated heartbeat and response</text>
  <path d="M700 976H752" class="config"/>
  <text x="764" y="981" class="legend">Reconcile desired configuration</text>
  <path d="M1110 976H1162" class="private"/>
  <text x="1174" y="981" class="legend">Optional operator tunnel · never node control</text>
</svg>
