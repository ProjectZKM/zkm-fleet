<text x="1500" y="794" class="detail">Replica reserves units</text>
<text x="1500" y="818" class="detail">Private application port</text>
<text x="1500" y="842" class="detail">Owner handles access</text>
<rect x="1210" y="965" width="500" height="85" rx="12" fill="#f0fdf4" stroke="#86efac" stroke-dasharray="6 4"/>
