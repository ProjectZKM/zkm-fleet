<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="900" viewBox="0 0 1320 900" role="img" aria-labelledby="title desc">
<title id="title">zkm-fleet architecture</title>
<desc id="desc">SDK clients reach the gateway and Rust proof scheduler backed by Postgres. fleetctl reaches the admin and runs APIs. The Python bridge reconciles configuration into Ray actors; Ray allocates GPUs and CPUs for prover nodes with local GPU servers, one-shot run containers, and persistent apps.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8Z" fill="#475569"/></marker><marker id="blueArrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#2563eb"/></marker></defs>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#0f172a}.title{font-size:26px;font-weight:700}.section{font-size:19px;font-weight:700}.name{font-size:18px;font-weight:700}.detail{font-size:15px;fill:#475569}.label{font-size:14px;fill:#475569}.line{fill:none;stroke:#475569;stroke-width:2;marker-end:url(#arrow)}.config{fill:none;stroke:#2563eb;stroke-width:2;stroke-dasharray:7 5;marker-end:url(#blueArrow)}</style>
<rect width="1320" height="900" fill="#ffffff"/>

