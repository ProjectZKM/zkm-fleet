<rect x="1204" y="456" width="332" height="120" rx="12" class="card"/>
<circle cx="1231" cy="486" r="5" fill="#ea580c"/>
<text x="1246" y="492" class="h2">Node side</text>
<text x="1226" y="524" class="m">Nodes dial out over HTTPS / WSS</text>
<text x="1226" y="548" class="m">No inbound node ports</text>
<rect x="1204" y="592" width="332" height="120" rx="12" class="card"/>
<circle cx="1231" cy="622" r="5" fill="#ea580c"/>
<text x="1246" y="628" class="h2">Fleet side</text>
<text x="1226" y="660" class="m">Syncs routes from Fleet</text>
<text x="1226" y="684" class="m">over outbound HTTPS</text>
<!-- Nodes connect outward only: heartbeats to the control host, tunnels to the data router. -->
<path d="M376 568V872" class="gray"/>
<path d="M376 568L370.5 579H381.5Z" class="gray-head"/>
<circle cx="376" cy="784" r="13" class="badge-c"/>
<text x="376" y="789" class="badge" text-anchor="middle">3</text>
<text x="400" y="778" class="m">Node-initiated HTTP/2 heartbeats to port 8905 · capacity · status · acknowledgments</text>
<text x="400" y="802" class="m">Responses carry launch, stop and service commands</text>
<path d="M1342 872V748" class="orange"/>
<text x="1360" y="778" class="m">Outbound HTTPS / WSS</text>
<text x="1360" y="802" class="m">from the shim's tunnel</text>
<text x="64" y="854" class="zone" style="fill:#475569">EXECUTION MACHINES</text>
<text x="267" y="854" class="cap">A … N</text>
<rect x="64" y="872" width="600" height="100" rx="12" class="card"/>
<text x="88" y="906" class="h">fleet-node agent + local Ray + bridge</text>
<text x="88" y="934" class="m">Applies commands · reserves Ray resources · reports availability</text>
<text x="88" y="958" class="m">Supervised by systemd (node, Ray) or the cron watchdog</text>
<path d="M664 922H704" class="blue"/>
<rect x="704" y="872" width="420" height="100" rx="12" class="card"/>
<text x="728" y="906" class="h">trusted-shim runtime</text>
<text x="728" y="934" class="m">Its own systemd service (zkm-fleet-shim)</text>
<text x="728" y="958" class="m">Keeps running through agent upgrades</text>
<rect x="1164" y="872" width="356" height="100" rx="12" class="opt"/>
<text x="1188" y="906" class="h">Chisel tunnel helper</text>
<text x="1188" y="934" class="m">Optional · beside the shim</text>
<text x="1188" y="958" class="m">Carries the data router's streams</text>
<path d="M914 972V1004" class="blue"/>
<path d="M1342 972V1004" class="orange"/>
<!-- Every app replica and batch job is a container of the shim. -->
<rect x="64" y="1004" width="1456" height="152" rx="14" fill="#f0fdfa" stroke="#5eead4" stroke-width="1.5"/>
<text x="88" y="1034" class="zone" style="fill:#0f766e">SHIM CONTAINERS</text>
<text x="257" y="1034" class="cap">Every app replica and batch job runs in one · Docker, OpenShell, TEE or TEE-simulation driver</text>
<circle cx="1494" cy="1029" r="13" class="badge-c"/>
<text x="1494" y="1034" class="badge" text-anchor="middle">4</text>
<rect x="88" y="1050" width="700" height="90" rx="12" fill="#f0fdf4" stroke="#86efac" stroke-width="1.25"/>
<text x="112" y="1080" class="h">Apps</text>
<text x="112" y="1106" class="b">Long-running replicas · serving · proving</text>
<text x="112" y="1128" class="s">Ports on node loopback · services via the data router</text>
<rect x="812" y="1050" width="684" height="90" rx="12" fill="#faf5ff" stroke="#d8b4fe" stroke-width="1.25"/>
<text x="836" y="1080" class="h">Batch jobs</text>
<text x="836" y="1106" class="b">Finite commands · queued jobs</text>
<text x="836" y="1128" class="s">A fresh container per attempt · resources released on cleanup</text>
<rect x="64" y="1176" width="1456" height="48" rx="12" class="card"/>
<text x="88" y="1206"><tspan class="lb">Shared CPU / GPU pool</tspan><tspan class="b">  ·  Ray reserves CPUs, GPUs and memory for every app replica and batch job</tspan></text>
<!-- The data layer belongs to the applications. -->
<path d="M420 1264V1296" class="green"/>
<path d="M420 1264L414.5 1275H425.5Z" class="green-head"/>
<path d="M1180 1264V1296" class="green"/>
<path d="M1180 1264L1174.5 1275H1185.5Z" class="green-head"/>
<rect x="40" y="1296" width="1520" height="84" rx="16" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
<text x="68" y="1330" class="h">Application-owned storage + artifacts</text>
<text x="68" y="1358" class="b">Inputs · checkpoints · proofs · outputs · optional shared mounts</text>
<text x="1500" y="1346" class="m" text-anchor="end">Workers read and write it directly · Fleet copies none of it</text>
<circle cx="1532" cy="1322" r="13" class="badge-c"/>
<text x="1532" y="1327" class="badge" text-anchor="middle">6</text>
