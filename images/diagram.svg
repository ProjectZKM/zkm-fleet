<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1470" viewBox="0 0 1600 1470" role="img" aria-labelledby="title desc">
<title id="title">Fleet architecture: control host, data router and execution machines</title>
<desc id="desc">Operators, SDK clients and automation call the control host over authenticated HTTPS on port 8905, and clients reach apps' declared services through the data router. The control host is one Docker Compose project: an Envoy HTTPS gateway in front of the scheduler and workload controller, which keeps namespaces, tokens, quotas and proof jobs in Postgres and embeds optional Rail policy evaluation; MCP, the OpenShell gateway and the Trustee Attestation Service are optional Compose profiles. The data router is a separate deployment with client, node and Fleet sides. Each execution machine sends heartbeats out to port 8905 and receives commands in the responses. On a machine, the fleet-node agent with its local Ray and bridge reserves resources and hands every app replica and batch job to the trusted-shim runtime, which runs it as a container on its Docker, OpenShell, TEE or TEE-simulation driver; an optional Chisel tunnel helper carries the data router's streams over outbound HTTPS or WSS. App ports are published on node loopback. Workers read and write application-owned storage directly. Numbered badges match the steps in the README.</desc>
