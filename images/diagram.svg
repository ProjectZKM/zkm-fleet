<text x="508" y="153" class="detail" text-anchor="start">Admin token</text>
<rect x="915" y="80" width="340" height="108" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="933" y="109" class="name" text-anchor="start">App clients</text>
<text x="933" y="133" class="detail" text-anchor="start">Studio / inference clients</text>
<text x="933" y="153" class="detail" text-anchor="start">App-specific endpoints</text>
<rect x="32" y="244" width="440" height="596" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="55" y="274" class="section" text-anchor="start">Control machine</text>
<rect x="50" y="288" width="404" height="405" rx="12" fill="#eff6ff" stroke="#bfdbfe"/>
<text x="65" y="313" class="detail" text-anchor="start">Docker Compose</text>
<rect x="65" y="334" width="370" height="88" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
<text x="83" y="363" class="name" text-anchor="start">Gateway · Envoy</text>
<text x="83" y="387" class="detail" text-anchor="start">mTLS :51000 · HTTP :9191</text>
<rect x="65" y="467" width="370" height="88" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
<text x="83" y="496" class="name" text-anchor="start">fleet-scheduler · Rust</text>
<text x="83" y="520" class="detail" text-anchor="start">Proof queue, placement and credentials</text>
<rect x="65" y="600" width="370" height="70" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
