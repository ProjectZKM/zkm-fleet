<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1420" viewBox="0 0 1600 1420" role="img" aria-labelledby="title desc">
<title id="title">Fleet architecture: control host, data router and execution machines</title>
<desc id="desc">Operators, SDK clients and automation reach the control host over authenticated HTTPS on port 8905. The control host is one Docker Compose project: an Envoy HTTPS gateway, the scheduler and workload controller with Postgres, and the optional MCP server, OpenShell gateway and Trustee Attestation Service as Compose profiles. The scheduler embeds optional Rail policy evaluation, whose proofs come from a remote proof network or guest. The OpenShell gateway talks to the scheduler over a private compute socket and serves mTLS on host port 17670, loopback by default. Trustee AS is reached only through the gateway's attestation route. The data router is a separate deployment with its own server and Compose project; clients reach apps' declared services through it. Each execution machine runs the fleet-node agent and its own local Ray with the bridge, supervised by systemd or the cron watchdog; the agent hands every app replica and batch job to the trusted-shim runtime, which runs it as a container on its Docker, OpenShell, TEE or TEE-simulation driver; the shim runs as its own service beside an optional Chisel tunnel helper, and app ports are published only on node loopback. Nodes connect outward only: HTTP/2 heartbeats to the control host on port 8905, and HTTPS or WSS to the data router. Workers read and write application-owned storage directly.</desc>
<defs>
<marker id="control" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker>
<marker id="data" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#2563eb"/></marker>
<marker id="local" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#15803d"/></marker>
<marker id="svc" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#c2410c"/></marker>
</defs>
<style>
text{font-family:Arial,Helvetica,sans-serif;fill:#0f172a}
.title{font-size:30px;font-weight:700}.name{font-size:22px;font-weight:700}
.detail{font-size:18px;fill:#475569}.small{font-size:16px;fill:#475569}
.label{font-size:16px;font-weight:700}
.box{fill:#fff;stroke:#cbd5e1;stroke-width:1.5}
.opt{fill:#fff;stroke:#94a3b8;stroke-width:1.5;stroke-dasharray:7 5}
.control{fill:none;stroke:#64748b;stroke-width:2.5;stroke-dasharray:8 6;marker-end:url(#control)}
.data{fill:none;stroke:#2563eb;stroke-width:2.5;marker-end:url(#data)}
.local{fill:none;stroke:#15803d;stroke-width:2.5;marker-end:url(#local)}
.svc{fill:none;stroke:#c2410c;stroke-width:2.5;marker-end:url(#svc)}
</style>
<rect width="1600" height="1420" fill="#fff"/>
<text x="40" y="50" class="title">zkm-fleet · one control plane for apps and batch jobs</text>
<text x="40" y="82" class="detail">Shared scheduling and resources. Independent execution on each machine. Nodes connect outward only.</text>

<rect x="40" y="110" width="1520" height="65" rx="12" class="box"/>
<text x="62" y="151" class="name">Operators · clients · automation</text>
<text x="550" y="151" class="detail">fleetctl · SDK · API · optional MCP</text>
<text x="1120" y="151" class="small">Submit · configure · observe</text>
<text x="270" y="202" class="small">Authenticated HTTPS · port 8905</text>
<path d="M1375 175V215" class="svc"/>
<text x="1360" y="202" class="small" text-anchor="end">Apps' declared services · HTTPS / WSS</text>

<!-- Policy and durable workload metadata live on the control host; optional services are Compose profiles. -->
<rect x="40" y="215" width="1110" height="510" rx="14" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
<text x="62" y="250" class="name">Control host</text>
<text x="372" y="250" class="small">One Docker Compose project · optional services are Compose profiles</text>

<rect x="62" y="275" width="290" height="425" rx="10" class="box"/>
<text x="82" y="310" class="name">HTTPS gateway</text>
<text x="82" y="342" class="detail">Envoy · port 8905</text>
<text x="82" y="372" class="detail">TLS for clients and nodes</text>
<text x="82" y="420" class="label">Routes</text>
<text x="82" y="451" class="small">API · node gRPC · policy ledger</text>
<text x="82" y="540" class="small">/mcp</text>
<text x="82" y="655" class="small">Attestation · node certificates</text>
<path d="M250 175V275" class="data"/>

<rect x="392" y="275" width="470" height="190" rx="10" class="box"/>
<text x="412" y="310" class="name">Scheduler + workload controller</text>
<text x="412" y="342" class="detail">Admission · quotas · priority · placement</text>
<text x="412" y="370" class="detail">App lifecycle · batch queue · recovery · cleanup</text>
<rect x="412" y="388" width="430" height="62" rx="8" class="opt"/>
<text x="428" y="413" class="label">Rail policy evaluation (embedded)</text>
<text x="428" y="439" class="small">Optional · proofs from a remote proof network or guest</text>

<rect x="902" y="275" width="226" height="190" rx="10" class="box"/>
<text x="922" y="310" class="name">Postgres</text>
<text x="922" y="342" class="small">Namespaces · tokens</text>
<text x="922" y="368" class="small">Proof jobs · quotas</text>
<text x="922" y="408" class="small">Workload records live in</text>
<text x="922" y="434" class="small">the scheduler's data_dir</text>
<path d="M352 446H392 M862 342H902" class="data"/>

<rect x="392" y="495" width="250" height="80" rx="10" class="opt"/>
<text x="412" y="527" class="name">MCP</text>
<text x="412" y="556" class="small">Optional · profile mcp</text>
<path d="M352 535H392 M497 495V465" class="data"/>

<rect x="392" y="600" width="250" height="100" rx="10" class="opt"/>
<text x="412" y="632" class="name">Trustee AS</text>
<text x="412" y="660" class="small">Optional · profile trustee</text>
<text x="412" y="686" class="small">Only via the attestation route</text>
<path d="M352 650H392" class="data"/>

<rect x="682" y="495" width="446" height="205" rx="10" class="opt"/>
<text x="702" y="527" class="name">OpenShell gateway</text>
<text x="702" y="558" class="small">Optional · Compose profile openshell</text>
<text x="702" y="592" class="small">Private compute socket to the scheduler</text>
<text x="702" y="620" class="small">mTLS on host port 17670, loopback by default</text>
<text x="702" y="648" class="small">No Docker socket or admin credentials</text>
<path d="M762 495V465" class="data"/>

<!-- The data router is its own deployment; it never runs on the control host. -->
<rect x="1190" y="215" width="370" height="510" rx="14" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
<text x="1212" y="250" class="name">Data router</text>
<text x="1212" y="282" class="detail">Separate deployment</text>
<text x="1212" y="314" class="small">Own server and Compose project;</text>
<text x="1212" y="340" class="small">not on the control host</text>
<rect x="1212" y="370" width="326" height="95" rx="10" class="box"/>
<text x="1232" y="400" class="label">Client side</text>
<text x="1232" y="426" class="small">Clients reach apps'</text>
<text x="1232" y="450" class="small">declared services here</text>
<rect x="1212" y="485" width="326" height="95" rx="10" class="box"/>
<text x="1232" y="515" class="label">Node side</text>
<text x="1232" y="541" class="small">Nodes dial out over HTTPS / WSS;</text>
<text x="1232" y="565" class="small">no inbound node ports</text>
<rect x="1212" y="600" width="326" height="95" rx="10" class="box"/>
<text x="1232" y="630" class="label">Fleet side</text>
<text x="1232" y="656" class="small">Polls Fleet for route sync</text>
<text x="1232" y="680" class="small">over outbound HTTPS</text>

<!-- Each machine initiates heartbeats; Fleet sends commands in responses. -->
<text x="320" y="757" class="small">Node-initiated HTTP/2 heartbeats to port 8905: capacity · status · acknowledgments</text>
<text x="320" y="782" class="small">Heartbeat responses: launch · stop · service commands</text>
<text x="1318" y="757" class="small">Outbound HTTPS / WSS</text>
<text x="1318" y="782" class="small">from the shim and its tunnel</text>

<!-- Every execution machine runs the same components; the stacked cards stand for machines A … N. -->
<rect x="56" y="816" width="1504" height="380" rx="14" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
<rect x="48" y="808" width="1504" height="380" rx="14" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
<rect x="40" y="800" width="1504" height="380" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="62" y="835" class="name">Execution machines</text>
<text x="320" y="835" class="small">A … N: each runs these components with its own local Ray</text>

<rect x="62" y="855" width="680" height="90" rx="10" class="box"/>
<text x="82" y="887" class="name">fleet-node agent + local Ray + bridge</text>
<text x="82" y="914" class="small">Applies commands · reserves Ray resources · reports availability</text>
<text x="82" y="936" class="small">Supervised by systemd units (node, Ray) or the cron watchdog</text>
<path d="M742 900H782" class="data"/>
<rect x="782" y="855" width="420" height="90" rx="10" class="box"/>
<text x="802" y="887" class="name">trusted-shim runtime</text>
<text x="802" y="914" class="small">Own systemd service (zkm-fleet-shim)</text>
<text x="802" y="936" class="small">Keeps running through agent upgrades</text>
<rect x="1232" y="855" width="290" height="90" rx="10" class="opt"/>
<text x="1252" y="887" class="name">Chisel tunnel helper</text>
<text x="1252" y="914" class="small">Optional · beside the shim</text>
<text x="1252" y="936" class="small">Carries router streams</text>

<!-- Every app replica and batch job is a container of the shim. -->
<path d="M992 945V972" class="data"/>
<path d="M1377 945V972" class="svc"/>
<rect x="62" y="972" width="1460" height="131" rx="12" fill="#f0fdfa" stroke="#2dd4bf" stroke-width="1.5"/>
<text x="82" y="995" class="label">Shim containers <tspan class="small" font-weight="400">· every app replica and batch job runs in one, on the Docker, OpenShell, TEE or TEE-simulation driver</tspan></text>
<rect x="82" y="1005" width="700" height="88" rx="10" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
<text x="102" y="1033" class="name">Apps</text>
<text x="102" y="1059" class="detail">Long-running replicas · serving · proving</text>
<text x="102" y="1083" class="small">Ports on node loopback · services reached through the data router</text>
<rect x="812" y="1005" width="690" height="88" rx="10" fill="#faf5ff" stroke="#d8b4fe" stroke-width="1.5"/>
<text x="832" y="1033" class="name">Batch jobs</text>
<text x="832" y="1059" class="detail">Finite commands · queued jobs</text>
<text x="832" y="1083" class="small">A fresh container per attempt · resources released on cleanup</text>

<rect x="62" y="1115" width="1460" height="45" rx="10" class="box"/>
<text x="82" y="1145" class="detail">Shared CPU / GPU pool · Ray reserves CPUs, GPUs and memory for every app replica and batch job</text>

<!-- Nodes connect outward only: heartbeats to the control host, service tunnels to the data router. -->
<path d="M300 700V855" class="control"/>
<path d="M300 700L292 712H308Z" fill="#64748b"/>
<path d="M1300 855V725" class="svc"/>

<!-- The data layer belongs to applications, rather than scheduler metadata. -->
<path d="M410 1196V1240 M1190 1196V1240" class="local"/>
<path d="M410 1196L402 1208H418Z M1190 1196L1182 1208H1198Z" fill="#15803d"/>
<rect x="40" y="1240" width="1520" height="80" rx="12" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
<text x="62" y="1274" class="name">Application-owned storage + artifacts</text>
<text x="62" y="1303" class="detail">Inputs · checkpoints · proofs · outputs · optional shared mounts</text>
<text x="1080" y="1286" class="small">Workers read / write directly</text>
<text x="40" y="1350" class="small">Apps expose application-specific endpoints or run their own pipelines. SDK proof requests may use the Fleet gateway.</text>
<text x="40" y="1378" class="small">Dashed gray: node control + metadata. Blue: requests + commands. Orange: app service traffic. Green: worker data access.</text>
<text x="40" y="1406" class="small">Dashed outline: optional. Each batch job runs on one machine; machines use separate Ray runtimes.</text>
</svg>
