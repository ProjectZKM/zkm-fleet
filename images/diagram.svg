<text x="573" y="516" class="detail" text-anchor="start">One proof at a time</text>
<rect x="955" y="443" width="300" height="95" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
<text x="973" y="472" class="name" text-anchor="start">GPU server container</text>
<text x="973" y="496" class="detail" text-anchor="start">Ziren GPU prover</text>
<text x="973" y="516" class="detail" text-anchor="start">Same machine as its node</text>
<rect x="555" y="590" width="300" height="95" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
<text x="573" y="619" class="name" text-anchor="start">Runs API actor</text>
<text x="573" y="643" class="detail" text-anchor="start">:9192 · admin token</text>
<text x="573" y="663" class="detail" text-anchor="start">runs.yaml profiles</text>
<rect x="955" y="590" width="300" height="95" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
<text x="973" y="619" class="name" text-anchor="start">One-shot run containers</text>
<text x="973" y="643" class="detail" text-anchor="start">Training / batch jobs</text>
<text x="973" y="663" class="detail" text-anchor="start">Use granted GPU / CPU capacity</text>
<rect x="955" y="737" width="300" height="81" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
<text x="973" y="766" class="name" text-anchor="start">Persistent app actors</text>
<text x="973" y="790" class="detail" text-anchor="start">ComfyUI / inference containers</text>
<text x="555" y="769" class="detail" text-anchor="start">Ray owns resource reservations.</text>
<text x="555" y="793" class="detail" text-anchor="start">Each machine executes its workloads.</text>
