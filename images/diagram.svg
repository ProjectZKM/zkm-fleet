<text x="360" y="910" class="detail">Streamable HTTP</text>
<text x="360" y="934" class="detail">Anonymous discovery</text>
<text x="360" y="958" class="detail">Scoped tool execution</text>
<rect class="box" x="70" y="1020" width="520" height="190" rx="14" fill="#fff" stroke="#cbd5e1"/>
<text x="90" y="1051" class="name">Resource accounting</text>
<text x="90" y="1080" class="detail">Namespace quota: shared GPU / CPU cap</text>
<text x="90" y="1104" class="detail">Counts allocations across apps and batches</text>
<text x="90" y="1128" class="detail">App resources: configured units × replicas</text>
<text x="90" y="1152" class="detail">Ray enforces local placement allocations</text>
<text x="90" y="1176" class="detail">Resource caps have no execution time limit</text>
<!-- Machine agent and explicit independent Ray runtime -->
<rect class="box" x="880" y="355" width="830" height="130" rx="14" fill="#fff" stroke="#cbd5e1"/>
