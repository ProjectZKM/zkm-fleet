# Merge this entry into the selected machine's existing apps.yaml.
# Stage it disabled; enable it only after the cutover steps in README.md, while every
# per-program GOAT SDK app stays disabled.
# The GPU image runs the worker too: the package lies in the storage root, which is mounted
# in, and its gpu-worker script (apps/gpu-worker.sh) is the container's entrypoint.
apps:
  - name: goat-proof-builder-v1
    kind: ziren-gpu
    namespace: REPLACE_WITH_NAMESPACE_ID
    app: goat-proof-builder-v1 # the namespace app (fleetctl app add goat-proof-builder-v1 --spec ... --elf-id ...)
    elf_id: REPLACE_WITH_FLEET_APP_ID # the package's fleet-app-id: the bundle id, not a member ELF
    proof_storage_root: /srv/zkm-fleet/apps/goat
    machine: REPLACE_WITH_LOCAL_RAY_NODE_HOSTNAME_OR_IP
    replicas: 1
    disabled: true
    # The Groth16 wrap runs on the worker's CPUs; size cpus for it as well as the GPUs.
    gpus: 4
    cpus: 48
    shm_gb: 64
    image: ghcr.io/projectzkm/ziren-gpu:latest
    entrypoint: /srv/zkm-fleet/apps/goat/metadata/gpu-worker
    runtime: {executor: shim, driver: docker}
    network: host                      # the container listens on the node's own ports
    port_base: 0
    container_port: 8080               # the worker's API, which answers the health check too
    health_path: /
    user: "1000:1000"                  # the account that owns the storage root
    # Relative ../circuits/data/... paths resolve inside the storage root; the worker reads
    # its private .env here.
    workdir: /srv/zkm-fleet/apps/goat/run
    # At least the longest proof plus its publication; measure it in staging.
    stop_timeout_s: 600
    ready_timeout_s: 600
    volumes:                           # mounted at the same path inside
      - /srv/zkm-fleet/apps/goat
      - /home/REPLACE_WITH_ACCOUNT/.zkm    # the Groth16 circuit artifacts
    command:
      - /usr/bin/env
      - PROOF_BUILDER_PROGRAMS_FILE=/srv/zkm-fleet/apps/goat/metadata/programs.json
      - /srv/zkm-fleet/apps/goat/metadata/proof-builder-rpc
      - --rpc-addr
      - 0.0.0.0:8080
      - --metrics-addr
      - 127.0.0.1:9200
      - --config
      - proof-builder.toml
      # Below stop_timeout_s, so the worker exits before Fleet kills it.
      - --drain-timeout-secs
      - "540"
    env:
      # The worker's: its threads and its identity.
      WORKER_THREADS: "{cpu_count}"
      FLEET_NODE_NAME: "{name}"
      FLEET_WORKER_ROLE: app
      FLEET_APP_NAMESPACE: "{namespace}"
      FLEET_APP: "{app}"
      FLEET_APP_ELF_ID: "{elf_id}"
      FLEET_APP_STORAGE_ROOT: "{proof_storage_root}"
      FLEET_APP_TENANT: goat
      # The entrypoint's own health responder; port 8080 is the worker's.
      HEALTH_PORT: "8081"
      # The GPU server's.
      CUDA_VISIBLE_DEVICES: "{gpus}"
      ZKM_GPU_DEVICES: "{gpus}"
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      RUST_BACKTRACE: "1"
      VERIFY_VK: "true"
      SHARD_SIZE: "16777216"
      ZIREN_LEAF_HOST_THREADS: "3"
      ZIREN_PROCESS_PER_GPU: "1"
      ZIREN_FUSE_LEAVES: "1"
      ZIREN_REDUCE_OVERLAP: "1"
      TMPDIR: /dev/shm
      # Set only if a staging Groth16 proof reports a committed-values digest mismatch.
      # ZKM_IMM_WRAP_VK: "1"
